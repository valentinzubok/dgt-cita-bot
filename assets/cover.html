<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
.c{width:640px;height:360px;position:relative;overflow:hidden;
   background:linear-gradient(135deg,#BE123C 0%,#E11D48 35%,#F97316 75%,#F59E0B 100%);
   font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 18% 22%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.dots{position:absolute;right:-40px;bottom:-60px;width:320px;height:320px;border-radius:50%;
   background:radial-gradient(circle,rgba(255,255,255,.18) 2px,transparent 2.5px) 0 0/22px 22px;opacity:.7}
.mark{position:absolute;left:28px;top:62px;width:236px;height:236px}
.txt{position:absolute;left:262px;top:92px;right:16px}
.t{font-size:78px;font-weight:800;letter-spacing:-2px;line-height:1}
.t b{color:#FDE047}
.tag{margin-top:14px;font-size:24px;font-weight:600;line-height:1.25;opacity:.97}
.chips{margin-top:22px;display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:999px;
   padding:5px 10px;font-size:13.5px;font-weight:600;backdrop-filter:blur(4px)}
</style></head><body><div class="c"><div class="glow"></div><div class="dots"></div>
<img class="mark" src="mark.svg">
<div class="txt"><div class="t"><b>Ok</b>Sita</div>
<div class="tag">Свободные citas в DGT —<br>сразу в Telegram</div>
<div class="chips"><span class="chip">🔔 уведомления</span><span class="chip">🗓 календарь</span><span class="chip">🇪🇸 68 офисов</span></div>
</div></div></body></html>
